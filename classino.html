<!doctype html>
<html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>کلاسینو | کلاس آنلاین</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 10%,#143a67,transparent 40%),#061225;color:#edf6ff;font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.panel{background:#0d203bd9;border:1px solid #35618b66;border-radius:18px;padding:18px;margin-bottom:15px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:800}.brand span{color:#54e1f4}.muted{color:#a6bbd5;font-size:13px;line-height:1.9}input{background:#06172b;color:white;border:1px solid #35618b;border-radius:10px;padding:12px;font:inherit;width:100%;margin:6px 0 12px}button{background:#102d50;color:white;border:1px solid #35618b;border-radius:10px;padding:11px 15px;font:inherit;cursor:pointer;margin:3px}button.primary{background:linear-gradient(120deg,#1676e8,#19a9cb);border:0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{height:240px;background:#020914;border:1px solid #35618b;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.name{position:absolute;bottom:8px;right:8px;background:#061225dd;padding:5px 9px;border-radius:7px}.chat{height:150px;overflow:auto;background:#06172b;padding:10px;border-radius:10px}.msg{margin:5px 0;padding:7px;background:#102d50;border-radius:8px}.msg b{color:#54e1f4}.log{white-space:pre-wrap;color:#ffd6a0;font-size:12px;line-height:1.8;margin-top:8px}@media(max-width:600px){.wrap{padding:10px}.tiles{grid-template-columns:1fr}.tile{height:220px}}
</style>
<div class="wrap"><header class="top"><div class="brand">کلاس<span>ینو</span></div><div id="status" class="muted">آماده اتصال</div></header>
<section id="setup" class="panel"><h2>ورود به کلاس آنلاین</h2><div class="row"><div><label>نام شما</label><input id="name" placeholder="مثلاً علی"><label>کد کلاس</label><input id="room" placeholder="مثلاً class101"></div><div class="muted">دبیر کلاس را ایجاد می‌کند و کد را به دانش‌آموزان می‌دهد. اگر دوربین یا میکروفون دستگاهی فعال نباشد، می‌تواند تصویر و صدای طرف مقابل را دریافت کند. برای فعال‌کردن دوربین و میکروفون، اجازه مرورگر لازم است.</div></div><button class="primary" id="teacher">ایجاد کلاس به‌عنوان دبیر</button><button id="student">ورود به‌عنوان دانش‌آموز</button><div id="setupLog" class="log"></div></section>
<section id="class" class="panel hidden"><div class="top"><div><h2 id="title">کلاس آنلاین</h2><div id="roomInfo" class="muted"></div></div><button id="leave">خروج از کلاس</button></div><button id="copy">کپی کد کلاس</button><button id="mic">خاموش‌کردن میکروفون</button><button id="cam">خاموش‌کردن دوربین</button><button id="retry">تلاش دوباره برای دوربین/میکروفون</button><div id="mediaInfo" class="muted"></div><div id="tiles" class="tiles"></div><h3>گفت‌وگوی کلاس</h3><div id="chat" class="chat"></div><form id="chatForm" class="row"><input id="message" placeholder="پیام خود را بنویسید"><button class="primary">ارسال</button></form><div id="log" class="log"></div></section><div class="muted" style="text-align:center">کلاسینو • نسخه آزمایشی</div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{'use strict';
const SERVER={host:'classino-5me-classino.runflare.cloud',port:443,path:'/peerjs',secure:true,debug:2,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}};
const $=x=>document.getElementById(x),S={peer:null,role:'',name:'',room:'',stream:null,conns:new Map(),calls:new Map(),names:new Map(),mic:true,cam:true};
const roomId=()=>'classino-'+S.room.toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,30);
function log(t){$('log').textContent=t+'\n'+$('log').textContent}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addChat(n,m){let d=document.createElement('div');d.className='msg';d.innerHTML='<b>'+esc(n)+':</b> '+esc(m);$('chat').append(d);$('chat').scrollTop=$('chat').scrollHeight}
function tile(id,n,stream,local=false){let el=$('tile-'+id);if(!el){el=document.createElement('div');el.className='tile';el.id='tile-'+id;$('tiles').append(el)}el.innerHTML='';if(stream){let v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=local;v.srcObject=stream;el.append(v);v.play().catch(()=>{})}else el.innerHTML='<div class="muted">'+esc(n)+'<br>تصویر دوربین در دسترس نیست</div>';let nm=document.createElement('div');nm.className='name';nm.textContent=n;el.append(nm)}
function sendAll(data,except){let count=0;for(const [id,c] of S.conns){if(id!==except&&c.open){try{c.send(data);count++}catch(e){}}}return count}
async function media(){try{S.stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('mediaInfo').textContent='دوربین و میکروفون فعال است.';tile('local',S.name,S.stream,true);return S.stream}catch(e){S.stream=null;$('mediaInfo').textContent='دوربین/میکروفون فعال نشد؛ دریافت رسانه طرف مقابل همچنان ممکن است. '+e.message;tile('local',S.name,null,true);log('رسانه: '+e.name+' '+e.message);return null}}
function wireCall(call){call.on('stream',st=>{let n=S.names.get(call.peer)||'شرکت‌کننده';tile(call.peer,n,st);log('تصویر/صدای طرف مقابل دریافت شد: '+n)});call.on('error',e=>log('خطای تماس رسانه: '+e.message))}
function callPeer(id){if(S.stream&&S.peer&&id!==S.peer.id){let c=S.peer.call(id,S.stream,{metadata:{name:S.name}});if(c){S.calls.set(id,c);wireCall(c)}}}
function wire(c){c.on('open',()=>{S.conns.set(c.peer,c);c.send({type:'hello',name:S.name,role:S.role});log('اتصال پیام برقرار شد: '+c.peer);if(S.role==='teacher'&&S.stream)callPeer(c.peer)});c.on('data',d=>{if(d.type==='hello'){S.names.set(c.peer,d.name||'شرکت‌کننده');tile(c.peer,d.name||'شرکت‌کننده',null);if(S.role==='teacher'&&S.stream)callPeer(c.peer)}else if(d.type==='chat'){addChat(d.name,d.message);if(S.role==='teacher')sendAll(d,c.peer)}else if(d.type==='roster'){(d.people||[]).forEach(x=>{S.names.set(x.id,x.name);tile(x.id,x.name,null)})}else if(d.type==='join'){S.names.set(d.id,d.name);tile(d.id,d.name,null);if(S.role==='teacher'&&S.stream)callPeer(d.id)}});c.on('close',()=>{S.conns.delete(c.peer);log('اتصال پیام بسته شد: '+c.peer)})}
async function start(role){S.name=$('name').value.trim()||(role==='teacher'?'دبیر':'دانش‌آموز');S.room=$('room').value.trim();if(!S.room){$('setupLog').textContent='ابتدا کد کلاس را بنویس.';return}if(!window.Peer){$('setupLog').textContent='PeerJS بارگذاری نشد؛ دسترسی به unpkg.com را بررسی کن.';return}S.role=role;$('setup').classList.add('hidden');$('class').classList.remove('hidden');$('title').textContent=role==='teacher'?'کلاس دبیر':'کلاس دانش‌آموز';$('roomInfo').textContent='کد کلاس: '+S.room;$('status').textContent='در حال اتصال';await media();try{S.peer=new Peer(role==='teacher'?roomId():undefined,SERVER);S.peer.on('open',id=>{$('status').textContent='متصل به سرور';log('شناسه Peer: '+id);if(role==='teacher'){tile('local',S.name,S.stream,true);S.peer.on('connection',wire);S.peer.on('call',call=>{wireCall(call);call.answer(S.stream||undefined)});log('کلاس ساخته شد؛ کد را به دانش‌آموزان بده.')}else{let c=S.peer.connect(roomId(),{reliable:true,serialization:'json'});wire(c);S.peer.on('call',call=>{wireCall(call);call.answer(S.stream||undefined)});if(S.stream)callPeer(roomId());log('درخواست ورود به کلاس ارسال شد.')}});S.peer.on('error',e=>{log('خطای PeerJS ('+e.type+'): '+e.message);$('status').textContent='خطای اتصال'})}catch(e){log('خطا: '+e.message);$('status').textContent='اتصال ناموفق'}}
$('teacher').onclick=()=>start('teacher');$('student').onclick=()=>start('student');
$('chatForm').onsubmit=e=>{e.preventDefault();let m=$('message').value.trim();if(!m)return;addChat(S.name,m);if(!sendAll({type:'chat',name:S.name,message:m}))log('پیام فقط روی دستگاه شما ثبت شد؛ اتصال پیام هنوز باز نیست.');$('message').value=''};
$('copy').onclick=()=>navigator.clipboard?.writeText(S.room).then(()=>$('roomInfo').textContent='کد کلاس کپی شد: '+S.room).catch(()=>{});
$('mic').onclick=()=>{if(!S.stream)return log('میکروفون فعال نیست.');S.mic=!S.mic;S.stream.getAudioTracks().forEach(t=>t.enabled=S.mic);$('mic').textContent=S.mic?'خاموش‌کردن میکروفون':'فعال‌کردن میکروفون'};
$('cam').onclick=()=>{if(!S.stream)return log('دوربین فعال نیست.');S.cam=!S.cam;S.stream.getVideoTracks().forEach(t=>t.enabled=S.cam);$('cam').textContent=S.cam?'خاموش‌کردن دوربین':'فعال‌کردن دوربین'};
$('retry').onclick=async()=>{let st=await media();if(st){if(S.role==='teacher')for(let id of S.conns.keys())callPeer(id);else if(S.peer)callPeer(roomId())}};
$('leave').onclick=()=>{for(let c of S.conns.values())c.close();for(let c of S.calls.values())c.close();S.stream?.getTracks().forEach(t=>t.stop());S.peer?.destroy();location.reload()};
})();
</script>
